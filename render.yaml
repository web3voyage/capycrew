# Render Blueprint for the CapyCrew web app.
#
# NOTE: a Blueprint only binds to services Render created from a Blueprint. The live
# service was created from the dashboard, so this file documents and reproduces its
# configuration - it does not retroactively reconfigure it. Change the live service in
# the dashboard, or create a new Blueprint service from this file.
services:
  - type: web
    name: capycrew
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    # Render supplies $PORT; binding anywhere else fails the health check.
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: APP_ENV
        value: production
      # Absolute origin for canonical links, share images, robots.txt, and the sitemap.
      # Leave unset to fall back to RENDER_EXTERNAL_URL; set it once a custom domain is live.
      - key: PUBLIC_SITE_URL
        sync: false
      # Site-level mint switch. false holds the portal back: /mint serves the coming-soon
      # page and the mint APIs return 503.
      - key: MINT_ENABLED
        sync: false
      # Falls back to config/deployment.json when unset.
      - key: MINT_CONTRACT_ADDRESS
        sync: false
      - key: MINT_CHAIN_ID
        value: "46630"
      - key: MINT_CHAIN_NAME
        value: Robinhood Chain Testnet
      - key: MINT_NATIVE_CURRENCY_NAME
        value: Ether
      - key: MINT_NATIVE_CURRENCY_SYMBOL
        value: ETH
      - key: MINT_PRICE_USD
        value: "5"
      - key: RPC_URL
        value: https://rpc.testnet.chain.robinhood.com
      - key: EXPLORER_URL
        value: https://explorer.testnet.chain.robinhood.com
